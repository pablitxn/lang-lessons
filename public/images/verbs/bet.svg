<title id="cue-title">Dos personas colocan fichas junto a sus predicciones sobre un juego.</title>
<desc id="cue-desc">Cada una arriesga una ficha a que su predicción sea correcta; no es solo elegir. No se indica un tiempo verbal.</desc>
